<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — OpenChamber</title>
  <style>
    :root {
      --bg: #151313;
      --fg: #f0e6d2;
      --muted: #8a8279;
      --accent: #edb449;
      --error: #e74c3c;
      --surface: #1e1c1a;
      --border: #2a2826;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf6f1;
        --fg: #1a1a1a;
        --muted: #6b6560;
        --accent: #c78c1e;
        --error: #c0392b;
        --surface: #f0ebe5;
        --border: #e0d9d1;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: var(--surface);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      min-height: 44px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>OpenChamber needs an internet connection to communicate with the OpenCode server.</p>
    <a href="/" class="btn">Retry</a>
  </div>
</body>
</html>
