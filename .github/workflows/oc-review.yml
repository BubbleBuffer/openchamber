name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release-candidate quality layers
        run: bash scripts/verify.sh

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Verify protected browser workflows
        run: bun run --cwd tests test:browser

      - name: Create npm tarballs
        run: |
          npm run --prefix packages/session-state pack
          npm run --prefix packages/web pack

      - name: Smoke-test packed artifacts
        run: bun run smoke:packages -- packages/session-state/*.tgz packages/web/*.tgz
